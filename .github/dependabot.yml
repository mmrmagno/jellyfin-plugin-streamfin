version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /fuzz
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
