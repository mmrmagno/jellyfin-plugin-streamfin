name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the build provenance with Sigstore
      attestations: write # store the build provenance
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main and matches the project version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main"; exit 1; }
          version=$(grep -oP '(?<=<Version>)[^<]+' src/StreamFin.csproj)
          test "v$version" = "$TAG" || { echo "$TAG does not match version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: bash scripts/fetch-references.sh
      - run: bash scripts/build.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: artifacts/StreamFin-${{ env.VERSION }}.zip
      - run: cp "$BUNDLE" "artifacts/StreamFin-$VERSION.zip.sigstore.json"
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - name: Publish the release with an updated manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG:refs/tags/$TAG"
          notes=$(git tag -l --format='%(contents:body)' "$TAG")
          [ -n "$notes" ] || notes=$(git tag -l --format='%(contents:subject)' "$TAG")
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then previous=$TAG; else previous=$(gh release view --json tagName --jq .tagName); fi
          gh release download "$previous" -p manifest.json -D "$RUNNER_TEMP/previous"
          cp "$RUNNER_TEMP/previous/manifest.json" artifacts/manifest.json
          python3 scripts/manifest.py --manifest artifacts/manifest.json --zip "artifacts/StreamFin-$VERSION.zip" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/StreamFin-$VERSION.zip" \
            --changelog "$(cat "$RUNNER_TEMP/notes.txt")"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" "artifacts/StreamFin-$VERSION.zip" "artifacts/StreamFin-$VERSION.zip.sigstore.json" --verify-tag --title "StreamFin $VERSION" --notes-file "$RUNNER_TEMP/notes.txt"
          gh release upload "$TAG" artifacts/manifest.json --clobber
